name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install desktop and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libsecret-1-0 gnome-keyring dbus-x11 xvfb libfuse2 rpm
          npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build Linux packages
        run: pnpm dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Linux app with system keyring
        run: |
          dbus-run-session -- bash -c 'printf "%s\n" amber-ci-keyring | gnome-keyring-daemon --unlock --components=secrets; xvfb-run -a node tests/linux-packaged-smoke.cjs'
      - name: Calculate checksums
        run: cd release && sha256sum *.AppImage *.deb *.tar.gz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Amber-SSH-Linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30
